---
exclude_paths:
  # All markdown files
  - "**/*.md"
  # Config/tooling directories
  - ".codex/**"
  - ".claude/**"
  - ".expo/**"
  # Build artifacts
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  # Documentation
  - "docs/**"

engines:
  duplication:
    exclude_paths:
      - "CRMOrbit/views/screens/**"
      - "CRMOrbit/views/hooks/**"
      - "CRMOrbit/domains/migrations/**"
      - "CRMOrbit/scripts/**"
      - "CRMOrbit/tests/**"
      - "CRMOrbit/reducers/account.reducer.ts"
      - "CRMOrbit/reducers/organization.reducer.ts"
  metric:
    exclude_paths:
      - "CRMOrbit/views/**"
      - "CRMOrbit/domains/migrations/**"
      - "CRMOrbit/scripts/**"
      - "CRMOrbit/tests/**"
